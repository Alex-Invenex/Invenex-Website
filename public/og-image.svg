<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A0A0A"/>
      <stop offset="50%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#0A0A0A"/>
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#A855F7"/>
      <stop offset="100%" style="stop-color:#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="200" cy="200" r="300" fill="#8B5CF6" opacity="0.1" filter="url(#glow)"/>
  <circle cx="1000" cy="500" r="250" fill="#3B82F6" opacity="0.1" filter="url(#glow)"/>

  <!-- Accent line -->
  <rect x="100" y="280" width="200" height="4" rx="2" fill="url(#accentGradient)"/>

  <!-- Company name -->
  <text x="100" y="360" font-family="system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#FFFFFF">
    Invenex Solutions
  </text>

  <!-- Tagline -->
  <text x="100" y="420" font-family="system-ui, -apple-system, sans-serif" font-size="32" font-weight="400" fill="#A1A1AA">
    Premium Web Development &amp; Digital Solutions
  </text>

  <!-- Bottom accent -->
  <text x="100" y="540" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#8B5CF6">
    invenex.in
  </text>
</svg>
